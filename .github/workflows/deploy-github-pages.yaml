# Publishes the generated Storybook static site to GitHub Pages.
name: Deploy Storybook to GitHub Pages

# Run automatically when code is pushed to either branch below.
# workflow_dispatch also allows manual execution from the GitHub Actions UI.
on:
  push:
    branches:
      - master
      - codex-test-1
  workflow_dispatch:

# Minimum permissions required for GitHub Pages deployment.
# contents: read   -> allows the workflow to read repository contents.
# pages: write     -> allows publishing to GitHub Pages.
# id-token: write  -> required for secure GitHub Pages deployment authentication.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping Pages deployments from interfering with each other.
# Both main and codex-test-1 currently deploy to the SAME GitHub Pages site.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Use a GitHub-hosted Linux runner.
    runs-on: ubuntu-latest

    # Associates this job with GitHub's Pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout the exact branch/commit that triggered this workflow.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configure Node using the version stored in .nvmrc.
      # IMPORTANT: .nvmrc must be committed to this branch.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # Print the active runtime versions for troubleshooting.
      - name: Display environment
        run: |
          echo "Node:"
          node --version
          echo "npm:"
          npm --version

      # Install dependencies exactly as defined by package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Build Storybook as a static site.
      # Expected output directory: storybook-static/
      - name: Build Storybook
        run: npm run build-storybook

      # Configure GitHub Pages metadata for this workflow.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload exactly ONE artifact for deployment.
      # upload pages artifact uses the expected artifact name "github-pages".
      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: storybook-static

      # Deploy the single github-pages artifact.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
